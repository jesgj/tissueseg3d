name: Rust

on:
  push:
    branches: [main, rust-portable-app]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, test and lint
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxkbcommon-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgl1-mesa-dev
      - name: Check formatting
        run: cargo fmt --check
      - name: Run tests
        run: cargo test --locked
      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  build:
    name: Build and smoke test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            artifact: tissueseg3d-linux-x86_64
            binary: target/release/tissueseg3d
          - name: windows-x86_64
            os: windows-2022
            artifact: tissueseg3d-windows-x86_64
            binary: target/release/tissueseg3d.exe
          - name: macos-arm64
            os: macos-15
            artifact: tissueseg3d-macos-arm64
            binary: target/release/tissueseg3d
          - name: macos-x86_64
            os: macos-15-intel
            artifact: tissueseg3d-macos-x86_64
            binary: target/release/tissueseg3d
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Install native GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxkbcommon-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgl1-mesa-dev
      - name: Test processing and application state on this platform
        run: cargo test --locked --all-targets
      - name: Build release binary
        run: cargo build --release --locked
      - name: Smoke test --help
        shell: bash
        run: |
          "${{ matrix.binary }}" --help
      - name: Smoke test headless demo batch
        shell: bash
        run: |
          set -eu
          rm -rf smoke
          mkdir -p smoke
          "${{ matrix.binary }}" --batch-demo --output-dir smoke
          ls -l smoke
          test -n "$(find smoke -maxdepth 1 -name '*.csv' -print -quit)"
          test -n "$(find smoke -maxdepth 1 -name '*_lbl.tif' -print -quit)"
      - name: Stage archive contents
        shell: bash
        run: |
          set -eu
          name="${{ matrix.artifact }}"
          mkdir -p "dist/$name"
          cp "${{ matrix.binary }}" "dist/$name/"
          cp LICENSE README.md "dist/$name/"
          # Optional: present only once the notices file exists in the repository.
          for notices in THIRD_PARTY_NOTICES THIRD_PARTY_NOTICES.*; do
            if [ -f "$notices" ]; then
              cp "$notices" "dist/$name/"
            fi
          done
          ls -l "dist/$name"
      - name: Create tar.gz archive (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          name="${{ matrix.artifact }}"
          # tar preserves the executable mode of the binary; a bare uploaded
          # executable would lose it when the artifact is downloaded again.
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          ls -l dist
      - name: Create zip archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "${{ matrix.artifact }}"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach archives to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify downloaded platform archives
        shell: bash
        run: |
          set -eu
          ls -l artifacts
          # Attach the archives built in the build job: their executable modes
          # are already correct, so nothing is re-zipped here.
          for archive in artifacts/*.tar.gz artifacts/*.zip; do
            [ -e "$archive" ] || continue
            test -s "$archive"
          done
      - name: Attach archives to the tagged release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
          generate_release_notes: true
