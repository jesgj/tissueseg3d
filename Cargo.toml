[package]
name = "tissueseg3d"
version = "0.1.0"
edition = "2021"
description = "Native 3D tissue segmentation core (membrane and nuclei)"
license = "BSD-3-Clause"

[lib]
name = "tissueseg3d"
path = "src/lib.rs"

[[bin]]
name = "tissueseg3d"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
anyhow = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiff = "0.10"
eframe = { version = "0.31", optional = true }
rfd = { version = "0.15", optional = true }

[profile.release]
lto = "thin"
strip = true
